<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50" fill="none">
  <!-- Bank Pillar Icon -->
  <g transform="translate(8, 7)">
    <!-- Roof pediment -->
    <path d="M18 3L2 12H34L18 3Z" fill="#1E3A8A" />
    <!-- Architrave -->
    <rect x="4" y="13" width="28" height="3" rx="1" fill="#1E3A8A" />
    <!-- 4 Pillars -->
    <rect x="6" y="17" width="3.5" height="12" rx="0.8" fill="#2563EB" />
    <rect x="13" y="17" width="3.5" height="12" rx="0.8" fill="#2563EB" />
    <rect x="20" y="17" width="3.5" height="12" rx="0.8" fill="#2563EB" />
    <rect x="27" y="17" width="3.5" height="12" rx="0.8" fill="#2563EB" />
    <!-- Base -->
    <rect x="4" y="30" width="28" height="3" rx="1" fill="#1E3A8A" />
    <!-- Sub-base -->
    <rect x="2" y="34" width="32" height="2.5" rx="1" fill="#1E3A8A" />
  </g>
  <!-- Text -->
  <g transform="translate(48, 14)">
    <text x="0" y="12" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#0F172A" letter-spacing="0.3">BANK</text>
    <text x="0" y="25" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" letter-spacing="0.8">TRANSFER</text>
  </g>
</svg>